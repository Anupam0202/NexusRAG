name: Cloudflare Preview Deploy

on:
  workflow_dispatch:
  push:
    branches: [v6-zero-cost-foundations-clean]
    paths:
      - frontend/**
      - apps/gateway/**
      - packages/**
      - .github/workflows/cloudflare-preview-deploy.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build and deploy OpenNext frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Preview
      url: ${{ vars.CLOUDFLARE_FRONTEND_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL || vars.CLOUDFLARE_GATEWAY_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL || vars.CLOUDFLARE_FRONTEND_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_OAUTH_PROVIDERS: ${{ vars.NEXT_PUBLIC_OAUTH_PROVIDERS || 'github' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require Cloudflare and public application configuration
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_API_URL NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from the Preview environment"
              missing+=("$name")
            fi
          done
          test "${#missing[@]}" -eq 0
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run cf:build
      - run: npm run cf:deploy
      - name: Verify deployed frontend and gateway
        working-directory: .
        env:
          FRONTEND_URL: ${{ vars.CLOUDFLARE_FRONTEND_URL }}
          GATEWAY_URL: ${{ vars.CLOUDFLARE_GATEWAY_URL }}
        run: |
          set -euo pipefail
          probe() {
            local url="$1"
            local expected="$2"
            local output
            for attempt in 1 2 3 4 5; do
              output="$(curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 "$url")" && {
                  printf '%s' "$output" | grep -q "$expected"
                  return 0
                }
              sleep $((attempt * 2))
            done
            return 1
          }
          probe "$FRONTEND_URL/" "NexusRAG"
          probe "$FRONTEND_URL/evidence-os" "Evidence"
          probe "$GATEWAY_URL/health" "ZERO_COST_LOW_TRAFFIC"
      - name: Publish deployment summary
        working-directory: .
        env:
          FRONTEND_URL: ${{ vars.CLOUDFLARE_FRONTEND_URL }}
          GATEWAY_URL: ${{ vars.CLOUDFLARE_GATEWAY_URL }}
        run: |
          {
            echo "## Cloudflare preview"
            echo
            echo "- Frontend: $FRONTEND_URL"
            echo "- Gateway health: $GATEWAY_URL/health"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Environment: \`Preview\`"
          } >> "$GITHUB_STEP_SUMMARY"