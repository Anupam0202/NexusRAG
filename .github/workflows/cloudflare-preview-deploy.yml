name: Cloudflare Preview Deploy
# Deploys the candidate preview on request, from any branch of this repository. The preview has its own
# Workers, queue and Qdrant collection and uses the rehearsal Supabase project. scripts/release.py refuses
# to bind anything else, so this workflow cannot touch the Workers that serve production.

on:
  workflow_dispatch:
    inputs:
      deploy_candidate_preview:
        description: Deploy this branch to the candidate preview
        required: true
        default: false
        type: boolean
  # Keeps the required check context on pull requests; the jobs are skipped there.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: nexusrag-candidate-preview-deployment
  cancel-in-progress: false

jobs:
  gateway:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_candidate_preview }}
    name: Deploy authenticated Evidence API gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: NexusRAG-Candidate-Preview
    env:
      RELEASE_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GEMINI_USER_KEY_ENCRYPTION_SECRET: ${{ secrets.GEMINI_USER_KEY_ENCRYPTION_SECRET }}
      # Only while rotating the encryption secret: the old one, so keys it sealed still open until re-sealed.
      GEMINI_USER_KEY_ENCRYPTION_SECRET_PREVIOUS: ${{ secrets.GEMINI_USER_KEY_ENCRYPTION_SECRET_PREVIOUS }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      # Empty means the gateway's default model policy (D24); set these variables to override.
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "24"}
      - name: Check required configuration
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY GEMINI_USER_KEY_ENCRYPTION_SECRET GOOGLE_API_KEY QDRANT_URL QDRANT_API_KEY; do
            test -n "${!name:-}" || { echo "::error::$name is missing from NexusRAG-Candidate-Preview"; exit 1; }
          done
          python3 -c 'import base64,os; assert len(base64.b64decode(os.environ["GEMINI_USER_KEY_ENCRYPTION_SECRET"],validate=True))==32, "encryption secret must be base64-encoded 32-byte key material"'
          python3 -c 'import base64,os; v=os.environ.get("GEMINI_USER_KEY_ENCRYPTION_SECRET_PREVIOUS",""); assert not v or len(base64.b64decode(v,validate=True))==32, "previous encryption secret must be base64-encoded 32-byte key material"'
          python3 scripts/release.py plan --target candidate
      - name: Apply pending migrations to the rehearsal database
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::warning::SUPABASE_DB_URL is not set for NexusRAG-Candidate-Preview, so pending migrations were not checked or applied."
            exit 0
          fi
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          python3 scripts/migration_status.py apply --snapshot-label "$(date -u +%Y%m%d%H%M%S)_${RELEASE_SHA:0:7}"
      - name: Verify the rehearsal schema and service credential
        run: |
          set -euo pipefail
          # A secret key (sb_secret_...) is not a JWT: Supabase refuses it as a Bearer token, so it goes in apikey only.
          service_headers() {
            printf 'header = "apikey: %s"\n' "$SUPABASE_SERVICE_ROLE_KEY"
            case "$SUPABASE_SERVICE_ROLE_KEY" in sb_*) ;; *) printf 'header = "Authorization: Bearer %s"\n' "$SUPABASE_SERVICE_ROLE_KEY" ;; esac
          }
          rpc() {
            curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              --config <(service_headers) \
              -H "Content-Type: application/json" -d "$2" "$SUPABASE_URL/rest/v1/rpc/$1"
          }
          rpc nexus_management_version '{}' | jq -e '.version == "036" and .atomic_members and .private_findings and .manual_finding_exports and .authoritative_member_identity' >/dev/null \
            || { echo "::error::Candidate schema migration 036 is not verified"; exit 1; }
          rpc nexus_authorize_byok_processing '{"p_workspace":null,"p_actor":null,"p_data_classification":"unknown"}' | jq -e '.state == "RIGHTS_BLOCKED"' >/dev/null \
            || { echo "::error::Candidate BYOK authority migration 037 is not verified"; exit 1; }
          rpc nexus_processing_policy_version '{}' | jq -e '.version == "039" and .terms_bound_owner_decisions and .service_only and .canonical_auth_role' >/dev/null \
            || { echo "::error::Candidate canonical processing authority migration 039 is not verified"; exit 1; }
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 \
            --config <(service_headers) \
            "$SUPABASE_URL/auth/v1/admin/users?per_page=1")"
          test "$code" = "200" || { echo "::error::The service credential does not authenticate against the rehearsal project."; exit 1; }
      - name: Deploy the gateway, smoke-test and roll back on failure
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$RUNNER_TEMP/gateway-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          # Secrets ship with the new version, so new code never takes traffic without them.
          jq -n '{SUPABASE_SERVICE_ROLE_KEY: env.SUPABASE_SERVICE_ROLE_KEY, GEMINI_USER_KEY_ENCRYPTION_SECRET: env.GEMINI_USER_KEY_ENCRYPTION_SECRET, GOOGLE_API_KEY: env.GOOGLE_API_KEY, QDRANT_URL: env.QDRANT_URL, QDRANT_API_KEY: env.QDRANT_API_KEY} + (if (env.GEMINI_USER_KEY_ENCRYPTION_SECRET_PREVIOUS // "") != "" then {GEMINI_USER_KEY_ENCRYPTION_SECRET_PREVIOUS: env.GEMINI_USER_KEY_ENCRYPTION_SECRET_PREVIOUS} else {} end)' >"$secrets_file"
          python3 scripts/release.py gateway --target candidate --sha "$RELEASE_SHA" --secrets-file "$secrets_file"

  frontend:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_candidate_preview }}
    needs: gateway
    name: Build and deploy OpenNext frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: NexusRAG-Candidate-Preview
    env:
      RELEASE_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_OAUTH_PROVIDERS: ${{ vars.NEXT_PUBLIC_OAUTH_PROVIDERS || 'google,github' }}
      # Products still in development to show, for example radar,evidence-api (frontend/src/lib/features.ts).
      NEXT_PUBLIC_FEATURES: ${{ vars.NEXT_PUBLIC_FEATURES || '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve public build settings
        working-directory: .
        run: |
          set -euo pipefail
          # Fails unless the build uses the rehearsal Supabase project; prints the preview's public URLs.
          python3 scripts/release.py env --target candidate >>"$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - name: Record public build identity
        run: SOURCE_COMMIT="$RELEASE_SHA" node scripts/write-build-info.mjs
      - run: npm run cf:build
      - name: Deploy the frontend, smoke-test and roll back on failure
        working-directory: .
        run: python3 scripts/release.py frontend --target candidate --sha "$RELEASE_SHA"
      - name: Install browsers for desktop and mobile E2E
        run: |
          # Avoid the HTTP Azure mirror timing out before Playwright can start.
          for apt_source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          npx playwright install --with-deps chromium firefox webkit
      - name: Run deployed desktop and mobile E2E
        run: |
          npm run test:visual:prepare
          E2E_BASE_URL="$NEXT_PUBLIC_SITE_URL" \
          E2E_OAUTH_PROVIDERS="$NEXT_PUBLIC_OAUTH_PROVIDERS" \
          npx playwright test \
            src/e2e/public-smoke.spec.ts \
            src/e2e/visual-regression.spec.ts \
            --project=chromium --project=mobile-chrome --trace off
          E2E_BASE_URL="$NEXT_PUBLIC_SITE_URL" \
          E2E_OAUTH_PROVIDERS="$NEXT_PUBLIC_OAUTH_PROVIDERS" \
          npx playwright test --config=playwright.cross-browser.config.ts --workers=2 --trace off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-preview-browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
