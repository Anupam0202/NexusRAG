name: Cloudflare Preview Deploy

on:
  workflow_dispatch:
  push:
    branches: [v6-zero-cost-foundations-clean]
    paths:
      - frontend/**
      - apps/gateway/**
      - packages/**
      - .github/workflows/cloudflare-preview-deploy.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build and deploy OpenNext frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_API_URL: ${{ vars.CLOUDFLARE_GATEWAY_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.CLOUDFLARE_FRONTEND_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_OAUTH_PROVIDERS: ${{ vars.NEXT_PUBLIC_OAUTH_PROVIDERS || 'github' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require Cloudflare and public application configuration
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_API_URL NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            test -n "${!name:-}" || { echo "::error::$name is missing from the Preview environment"; exit 1; }
          done
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run cf:build
      - run: npm run cf:deploy