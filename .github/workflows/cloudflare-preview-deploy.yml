name: Cloudflare Preview Deploy

on:
  workflow_dispatch:
  push:
    branches: [v6-zero-cost-foundations-clean]
    paths:
      - frontend/**
      - apps/gateway/**
      - packages/**
      - .github/workflows/cloudflare-preview-deploy.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build and deploy OpenNext frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Preview
      url: ${{ vars.CLOUDFLARE_FRONTEND_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL || vars.CLOUDFLARE_GATEWAY_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL || vars.CLOUDFLARE_FRONTEND_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_OAUTH_PROVIDERS: ${{ vars.NEXT_PUBLIC_OAUTH_PROVIDERS || 'github' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve canonical Cloudflare worker origins
        working-directory: .
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN is missing from the Preview environment"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing from the Preview environment"; exit 1; }

          if [ -z "${NEXT_PUBLIC_API_URL:-}" ] || [ -z "${NEXT_PUBLIC_SITE_URL:-}" ]; then
            response="$(curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
            subdomain="$(jq -er '.result.subdomain' <<<"$response")"
            {
              echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://nexusrag-v6-preview-gateway.${subdomain}.workers.dev}"
              echo "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://nexusrag-v6-frontend-preview.${subdomain}.workers.dev}"
            } >> "$GITHUB_ENV"
          fi
      - name: Require public application configuration
        run: |
          set -euo pipefail
          missing=()
          for name in NEXT_PUBLIC_API_URL NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from the Preview environment"
              missing+=("$name")
            fi
          done
          test "${#missing[@]}" -eq 0
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run cf:build
      - run: npm run cf:deploy
      - name: Verify deployed frontend and gateway
        working-directory: .
        run: |
          set -euo pipefail
          probe() {
            local url="$1"
            local expected="$2"
            local output
            for attempt in 1 2 3 4 5; do
              output="$(curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 "$url")" && {
                  printf '%s' "$output" | grep -q "$expected"
                  return 0
                }
              sleep $((attempt * 2))
            done
            return 1
          }
          probe "$NEXT_PUBLIC_SITE_URL/" "NexusRAG"
          probe "$NEXT_PUBLIC_SITE_URL/evidence-os" "Evidence"
          probe "$NEXT_PUBLIC_API_URL/health" "ZERO_COST_LOW_TRAFFIC"
      - name: Publish deployment summary
        working-directory: .
        run: |
          {
            echo "## Cloudflare preview"
            echo
            echo "- Frontend: $NEXT_PUBLIC_SITE_URL"
            echo "- Gateway health: $NEXT_PUBLIC_API_URL/health"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Environment: \`Preview\`"
          } >> "$GITHUB_STEP_SUMMARY"