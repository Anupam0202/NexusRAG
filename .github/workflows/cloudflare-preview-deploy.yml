name: Cloudflare Preview Deploy
# Keep this workflow in the exact-head verification set with live provider probes.
# Exact-head release evidence includes the completed Preview canary/rollback rehearsal.

on:
  workflow_dispatch:
  push:
    branches: [v6-zero-cost-foundations-clean]
    paths:
      - frontend/**
      - apps/gateway/**
      - packages/**
      - .github/workflows/cloudflare-preview-deploy.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Deploy authenticated Evidence API gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FRONTEND_ORIGIN: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      GATEWAY_ORIGIN: ${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "24"}
      - name: Require authenticated gateway inputs
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY FRONTEND_ORIGIN GATEWAY_ORIGIN; do
            test -n "${!name:-}" || { echo "::error::$name is missing from Preview"; exit 1; }
          done
      - name: Install Supabase service credential as a Worker secret
        run: printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx --yes wrangler@4.37.1 secret put SUPABASE_SERVICE_ROLE_KEY --name nexusrag-v6-preview-gateway
      - name: Deploy authenticated gateway
        run: |
          npx --yes wrangler@4.37.1 deploy apps/gateway/src/preview-worker.js \
            --name nexusrag-v6-preview-gateway \
            --compatibility-date 2026-09-20 \
            --keep-vars \
            --var "SUPABASE_URL:$SUPABASE_URL" \
            --var "SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY" \
            --var "FRONTEND_ORIGIN:$FRONTEND_ORIGIN"
      - name: Verify fail-closed authenticated gateway
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$GATEWAY_ORIGIN/health" | jq -e '.status == "READY" and .authenticated_api == true and .paid_fallback == false'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$GATEWAY_ORIGIN/api/v2/capabilities")" = 401

  frontend:
    needs: gateway
    name: Build and deploy OpenNext frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Preview
      url: ${{ vars.CLOUDFLARE_FRONTEND_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL || vars.CLOUDFLARE_GATEWAY_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL || vars.CLOUDFLARE_FRONTEND_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_OAUTH_PROVIDERS: ${{ vars.NEXT_PUBLIC_OAUTH_PROVIDERS || 'github' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve canonical Cloudflare worker origins
        working-directory: .
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN is missing from the Preview environment"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing from the Preview environment"; exit 1; }

          if [ -z "${NEXT_PUBLIC_API_URL:-}" ] || [ -z "${NEXT_PUBLIC_SITE_URL:-}" ]; then
            response="$(curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
            subdomain="$(jq -er '.result.subdomain' <<<"$response")"
            {
              echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://nexusrag-v6-preview-gateway.${subdomain}.workers.dev}"
              echo "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://nexusrag-v6-frontend-preview.${subdomain}.workers.dev}"
            } >> "$GITHUB_ENV"
          fi
      - name: Require public application configuration
        run: |
          set -euo pipefail
          missing=()
          for name in NEXT_PUBLIC_API_URL NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from the Preview environment"
              missing+=("$name")
            fi
          done
          test "${#missing[@]}" -eq 0
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run cf:build
      - run: npm run cf:deploy
      - name: Verify deployed frontend and gateway
        working-directory: .
        run: |
          set -euo pipefail
          probe() {
            local url="$1"
            local expected="$2"
            local output
            for attempt in 1 2 3 4 5; do
              output="$(curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 "$url")" && {
                  printf '%s' "$output" | grep -q "$expected"
                  return 0
                }
              sleep $((attempt * 2))
            done
            return 1
          }
          probe "$NEXT_PUBLIC_SITE_URL/" "NexusRAG"
          probe "$NEXT_PUBLIC_SITE_URL/evidence-os" "Evidence"
          probe "$NEXT_PUBLIC_API_URL/health" "ZERO_COST_LOW_TRAFFIC"
      - name: Install browser for desktop and mobile E2E
        run: npx playwright install --with-deps chromium
      - name: Run deployed desktop and mobile E2E
        run: |
          npm run test:visual:prepare
          E2E_BASE_URL="$NEXT_PUBLIC_SITE_URL" \
          E2E_OAUTH_PROVIDERS="$NEXT_PUBLIC_OAUTH_PROVIDERS" \
          npx playwright test \
            src/e2e/public-smoke.spec.ts \
            src/e2e/visual-regression.spec.ts \
            --project=chromium --project=mobile-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-preview-browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish deployment summary
        working-directory: .
        run: |
          {
            echo "## Cloudflare preview"
            echo
            echo "- Frontend: $NEXT_PUBLIC_SITE_URL"
            echo "- Gateway health: $NEXT_PUBLIC_API_URL/health"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Environment: \`Preview\`"
          } >> "$GITHUB_STEP_SUMMARY"