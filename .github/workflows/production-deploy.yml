name: Production Deploy
# Releases the current main commit to production, on request only. Order: snapshot and apply pending
# migrations, deploy the gateway together with its secrets, then build and deploy the frontend. Each Worker
# is smoke-tested and rolled back automatically if the smoke test fails, and a failed frontend release also
# restores the gateway. Database migrations are forward-only; the snapshot schema is the way back.
# Runbook: docs/DEPLOYMENT_PRODUCTION.md.

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact main commit to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nexusrag-production-deployment
  cancel-in-progress: false

jobs:
  gateway:
    name: Deploy production gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    outputs:
      previous_version: ${{ steps.release.outputs.previous_version }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GEMINI_USER_KEY_ENCRYPTION_SECRET: ${{ secrets.GEMINI_USER_KEY_ENCRYPTION_SECRET }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      # Empty means the gateway's default model policy (D24); set these variables to override.
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
      - name: Verify the release is the current main commit
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$RELEASE_SHA" || { echo "::error::Checked out $actual, expected $RELEASE_SHA."; exit 1; }
          test "$actual" = "$(git rev-parse origin/main)" || { echo "::error::Production deploys only the current main commit."; exit 1; }
      - uses: actions/setup-node@v5
        with: {node-version: "24"}
      - name: Check required configuration
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL GEMINI_USER_KEY_ENCRYPTION_SECRET GOOGLE_API_KEY QDRANT_URL QDRANT_API_KEY; do
            test -n "${!name:-}" || { echo "::error::$name is missing from the Production environment"; exit 1; }
          done
          python3 -c 'import base64,os; assert len(base64.b64decode(os.environ["GEMINI_USER_KEY_ENCRYPTION_SECRET"],validate=True))==32, "encryption secret must be base64-encoded 32-byte key material"'
          python3 scripts/release.py plan --target production
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 \
            --config <(printf 'header = "apikey: %s"\nheader = "Authorization: Bearer %s"\n' "$SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_SERVICE_ROLE_KEY") \
            "$SUPABASE_URL/auth/v1/admin/users?per_page=1")"
          test "$code" = "200" || { echo "::error::The service credential does not authenticate against the production project."; exit 1; }
      - name: Snapshot and apply pending migrations
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          # Copies every public table into a backup schema first, then applies each pending file in its own
          # transaction. A failing file rolls back and stops the release before any Worker changes.
          python3 scripts/migration_status.py apply --snapshot-label "$(date -u +%Y%m%d%H%M%S)_${RELEASE_SHA:0:7}"
      - name: Deploy the gateway, smoke-test and roll back on failure
        id: release
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$RUNNER_TEMP/gateway-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          # Secrets ship with the new version, so new code never takes traffic without them.
          jq -n '{SUPABASE_SERVICE_ROLE_KEY: env.SUPABASE_SERVICE_ROLE_KEY, GEMINI_USER_KEY_ENCRYPTION_SECRET: env.GEMINI_USER_KEY_ENCRYPTION_SECRET, GOOGLE_API_KEY: env.GOOGLE_API_KEY, QDRANT_URL: env.QDRANT_URL, QDRANT_API_KEY: env.QDRANT_API_KEY}' >"$secrets_file"
          python3 scripts/release.py gateway --target production --sha "$RELEASE_SHA" --secrets-file "$secrets_file"

  frontend:
    name: Deploy production frontend
    needs: gateway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_OAUTH_PROVIDERS: ${{ vars.NEXT_PUBLIC_OAUTH_PROVIDERS }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
      - name: Verify the release is the current main commit
        working-directory: .
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$RELEASE_SHA"
          test "$actual" = "$(git rev-parse origin/main)"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve public build settings
        working-directory: .
        run: |
          set -euo pipefail
          test -n "${NEXT_PUBLIC_OAUTH_PROVIDERS:-}" || { echo "::error::NEXT_PUBLIC_OAUTH_PROVIDERS is missing from the Production environment"; exit 1; }
          # Fails unless the build uses the production Supabase project; prints the public URLs.
          python3 scripts/release.py env --target production >>"$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - name: Record public build identity
        run: SOURCE_COMMIT="$RELEASE_SHA" node scripts/write-build-info.mjs
      - run: npm run cf:build
      - name: Deploy the frontend, smoke-test and roll back on failure
        id: release
        working-directory: .
        run: python3 scripts/release.py frontend --target production --sha "$RELEASE_SHA"
      - name: Production browser smoke
        run: |
          npx playwright install --with-deps chromium
          npm run test:visual:prepare
          E2E_BASE_URL="$NEXT_PUBLIC_SITE_URL" E2E_OAUTH_PROVIDERS="$NEXT_PUBLIC_OAUTH_PROVIDERS" \
            npx playwright test src/e2e/public-smoke.spec.ts src/e2e/visual-regression.spec.ts \
              --project=chromium --project=mobile-chrome --trace off
      - name: Roll the frontend back if a later check failed
        if: ${{ failure() && steps.release.outcome == 'success' && steps.release.outputs.previous_version != '' }}
        working-directory: .
        env:
          PREVIOUS_VERSION: ${{ steps.release.outputs.previous_version }}
        run: python3 scripts/release.py rollback --target production --component frontend --version "$PREVIOUS_VERSION"

  restore-gateway:
    name: Restore the gateway after a failed frontend release
    needs: [gateway, frontend]
    if: ${{ always() && needs.gateway.result == 'success' && needs.frontend.result != 'success' && needs.gateway.outputs.previous_version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PREVIOUS_VERSION: ${{ needs.gateway.outputs.previous_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-node@v5
        with: {node-version: "24"}
      - name: Roll the gateway back to the version that served before this release
        run: python3 scripts/release.py rollback --target production --component gateway --version "$PREVIOUS_VERSION"
