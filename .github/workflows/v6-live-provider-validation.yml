name: V6 Live Provider Validation
# Keep this workflow in the exact-head verification set with preview deployment.
# Exact-head release evidence includes the completed Preview canary/rollback rehearsal.
# Visual and rights releases re-run bounded providers on the same exact head.

on:
  workflow_dispatch:
  push:
    branches: [v6-zero-cost-foundations-clean, critical-gaps/v8-remote-validation, main]
    paths:
      - apps/gateway/**
      - scripts/live_provider_validation.py
      - scripts/preview_target.py
      - backend/src/vectorstores/qdrant_store.py
      - backend/src/generation/**
      - .github/workflows/v6-live-provider-validation.yml
      - tests/scripts/**

permissions:
  contents: read

concurrency:
  group: v6-live-provider-${{ github.ref }}
  # Do not interrupt the disposable Qdrant test between create and cleanup.
  cancel-in-progress: false

jobs:
  bounded-provider-validation:
    name: Bounded ${{ matrix.provider }} validation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: Preview
    strategy:
      fail-fast: false
      matrix:
        provider: [qdrant, gemini]
    env:
      LIVE_EXTERNAL_VALIDATION: "true"
      PROVIDER_UNDER_TEST: ${{ matrix.provider }}
      # Non-secret endpoints may be stored as Environment variables, while
      # credentials remain Environment secrets.
      QDRANT_URL: ${{ secrets.QDRANT_URL || vars.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION_PREFIX: ${{ vars.QDRANT_COLLECTION_PREFIX || 'nexusrag-ci' }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      VALIDATION_REPORT: artifacts/live-provider-${{ matrix.provider }}-validation.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Test bounded provider request contracts
        run: python3 -m unittest discover -s tests/scripts -p 'test_*.py'
      - name: Validate protected secret presence
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROVIDER_UNDER_TEST" = qdrant ]; then
            test -n "$QDRANT_URL" || { echo "::error::QDRANT_URL is missing"; exit 1; }
            test -n "$QDRANT_API_KEY" || { echo "::error::QDRANT_API_KEY is missing"; exit 1; }
          else
            test -n "$GOOGLE_API_KEY" || { echo "::error::GOOGLE_API_KEY is missing"; exit 1; }
          fi
      - name: Run bounded disposable validation
        run: python3 scripts/live_provider_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-live-${{ matrix.provider }}-validation
          path: artifacts/live-provider-${{ matrix.provider }}-validation.json
          # Missing/invalid secret preflight can fail before the report is written.
          if-no-files-found: ignore
          retention-days: 14
