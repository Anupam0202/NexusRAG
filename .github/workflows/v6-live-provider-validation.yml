name: V6 Live Provider Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/live_provider_validation.py
      - backend/src/vectorstores/qdrant_store.py
      - backend/src/generation/**
      - .github/workflows/v6-live-provider-validation.yml

permissions:
  contents: read

concurrency:
  group: v6-live-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-provider-validation:
    name: Bounded ${{ matrix.provider }} validation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: Preview
    strategy:
      fail-fast: false
      matrix:
        provider: [qdrant, gemini]
    env:
      LIVE_EXTERNAL_VALIDATION: "true"
      PROVIDER_UNDER_TEST: ${{ matrix.provider }}
      # Non-secret endpoints may be stored as Environment variables, while
      # credentials remain Environment secrets.
      QDRANT_URL: ${{ secrets.QDRANT_URL || vars.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION_PREFIX: ${{ vars.QDRANT_COLLECTION_PREFIX || 'nexusrag-ci' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      VALIDATION_REPORT: artifacts/live-provider-${{ matrix.provider }}-validation.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Validate protected secret presence
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROVIDER_UNDER_TEST" = qdrant ]; then
            test -n "$QDRANT_URL" || { echo "::error::QDRANT_URL is missing"; exit 1; }
            test -n "$QDRANT_API_KEY" || { echo "::error::QDRANT_API_KEY is missing"; exit 1; }
          else
            test -n "${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}" || { echo "::error::GEMINI_API_KEY or GOOGLE_API_KEY is missing"; exit 1; }
          fi
      - name: Run bounded disposable validation
        run: python3 scripts/live_provider_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-live-${{ matrix.provider }}-validation
          path: artifacts/live-provider-${{ matrix.provider }}-validation.json
          if-no-files-found: error
          retention-days: 14