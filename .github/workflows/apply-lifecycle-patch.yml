name: Apply validated lifecycle patch

on:
  push:
    branches:
      - v6-zero-cost-foundations-clean
    paths:
      - .github/workflows/apply-lifecycle-patch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-lifecycle-patch-v6
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: v6-zero-cost-foundations-clean
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/lifecycle.patch.gz.b64.part{1,2,3,4} \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/lifecycle.patch
          echo "1bd8f50580f1196e2bff3d40be694b6850fed8aa7831c197061a81a4b200455c  /tmp/lifecycle.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/lifecycle.patch

      - name: Apply and commit patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/lifecycle.patch
          git rm -r .agent .github/workflows/apply-lifecycle-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add document lifecycle, durable receipts, and hybrid chat"
          git push origin HEAD:v6-zero-cost-foundations-clean
