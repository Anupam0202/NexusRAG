name: One-time deployment identity sanitization

on:
  push:
    branches: [v6-zero-cost-foundations-clean]
    paths: [.github/workflows/one-time-sanitize-deployment-identity.yml]

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v6-zero-cost-foundations-clean
      - name: Sanitize committed deployment identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          extensions = {'.md', '.py', '.yaml', '.yml', '.txt', '.json', '.ts', '.tsx'}
          project_url = re.compile(r'https://[a-z]{20}\.supabase\.co')

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in extensions:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = project_url.sub('https://YOUR_SUPABASE_PROJECT_REF.supabase.co', text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          render_path = root / 'render.yaml'
          render = render_path.read_text(encoding='utf-8')
          render = render.replace(
              '      # Public project identity is pinned alongside JWKS so authentication and\n'
              '      # persistence can never drift across different Supabase projects.\n'
              '      - key: SUPABASE_URL\n'
              '        value: "https://YOUR_SUPABASE_PROJECT_REF.supabase.co"',
              '      # Configure the public project URL in Render. It must identify the same\n'
              '      # project as the JWKS endpoint and server-side credentials.\n'
              '      - key: SUPABASE_URL\n'
              '        sync: false',
          )
          render = render.replace(
              '      # Public verification endpoint pinned to the same Supabase project used\n'
              '      # by the Vercel frontend. This prevents stale legacy JWT secrets or a\n'
              '      # mismatched Supabase project from rejecting current ES256 sessions.\n'
              '      - key: SUPABASE_JWKS_URL\n'
              '        value: "https://YOUR_SUPABASE_PROJECT_REF.supabase.co/auth/v1/.well-known/jwks.json"',
              '      # Configure the JWKS endpoint for the same project as SUPABASE_URL.\n'
              '      # Keeping this external prevents environment identity from entering Git.\n'
              '      - key: SUPABASE_JWKS_URL\n'
              '        sync: false',
          )
          render_path.write_text(render, encoding='utf-8')

          test_path = root / 'backend/tests/test_security.py'
          test = test_path.read_text(encoding='utf-8')
          marker = 'def test_render_blueprint_pins_production_supabase_project() -> None:'
          if marker not in test:
              raise SystemExit('expected Render security test was not found')
          prefix = test.split(marker, 1)[0]
          replacement = '''def test_render_blueprint_requires_external_supabase_identity() -> None:\n    blueprint = (\n        Path(__file__).resolve().parents[2] / "render.yaml"\n    ).read_text(encoding="utf-8")\n\n    assert "- key: SUPABASE_URL\\n        sync: false" in blueprint\n    assert "- key: SUPABASE_JWKS_URL\\n        sync: false" in blueprint\n    assert "YOUR_SUPABASE_PROJECT_REF" not in blueprint\n    assert ".supabase.co" not in blueprint\n'''
          test_path.write_text(prefix + replacement, encoding='utf-8')

          status_path = root / 'docs/DEPLOYMENT_STATUS.md'
          status = status_path.read_text(encoding='utf-8')
          start = status.find('Verified on June 7, 2026:')
          end = status.find('\n## ', start + 1)
          if start == -1:
              raise SystemExit('expected historical deployment section was not found')
          replacement = '''Verified historical deployment identifiers have been removed from the repository.\n\nCurrent Cloudflare, Supabase, Qdrant, Gemini, Vercel, and Render mappings must be discovered at deployment time and recorded only in protected environment configuration or sanitized evidence. Do not infer production parity from this document.\n'''
          status_path.write_text(status[:start] + replacement + (status[end:] if end != -1 else ''), encoding='utf-8')

          if any(project_url.search(path.read_text(encoding='utf-8')) for path in root.rglob('*') if path.is_file() and '.git' not in path.parts and path.suffix.lower() in extensions):
              raise SystemExit('project-specific Supabase URL remains')
          PY
          python3 -m py_compile backend/tests/test_security.py
          rm .github/workflows/one-time-sanitize-deployment-identity.yml
          git config user.name 'Anupam Roy'
          git config user.email '42176802+Anupam0202@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'security: remove deployment account identifiers'
          git push origin HEAD:v6-zero-cost-foundations-clean
