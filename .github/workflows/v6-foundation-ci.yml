name: V6 Foundation CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: v6-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  self-managed-runtime:
    uses: ./.github/workflows/container-verification.yml
  migration-integrity:
    name: Migration integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python3 scripts/verify_v6_migrations.py
      - run: python3 -m unittest discover -s tests/scripts -p 'test_*.py'
  backend-isolated:
    name: Backend isolated regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python3 -m compileall -q src tests
        working-directory: backend
      - run: python3 scripts/run_isolated.py
        working-directory: backend
  backend-full:
    name: Backend complete offline suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python3 -m pip install --upgrade "pip>=26.2"
      - run: python3 -m pip install -r backend/requirements-test.txt
      - run: python3 backend/scripts/run_full_tests.py
  evaluation-inventory:
    name: Evaluation inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python3 evals/build_v6_dataset.py --output-dir /tmp/nexusrag-v6-evals
        working-directory: backend
      - name: Score fixed synthetic contract gates
        run: |
          python3 evals/score_v6_contracts.py \
            --labeled /tmp/nexusrag-v6-evals/v6-labeled.jsonl \
            --heldout /tmp/nexusrag-v6-evals/v6-heldout.jsonl \
            --output /tmp/nexusrag-v6-evals/v6-contract-score.json
        working-directory: backend
      - name: Validate required counts and held-out separation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/nexusrag-v6-evals/v6-inventory.json').read_text())
          assert report['status']=='FIXTURE_INVENTORY_ONLY'
          assert report['labeled_cases'] >= 400
          assert report['heldout_cases'] >= 125
          score=json.loads(Path('/tmp/nexusrag-v6-evals/v6-contract-score.json').read_text())
          assert score['status']=='SYNTHETIC_CONTRACT_GATES_PASSED'
          assert score['production_quality_claimed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v6-evaluation-inventory
          path: /tmp/nexusrag-v6-evals
          if-no-files-found: error
          retention-days: 14
  cloudflare-foundation:
    name: Cloudflare compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "24"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: npm run check:cloudflare
      - run: npm run test:cloudflare
  frontend:
    name: Frontend lint, unit, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test -- --reporter=default
        working-directory: frontend
      - run: npm exec tsc -- --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-public-browser-test-key
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Public desktop/mobile and visual browser regressions
        working-directory: frontend
        run: |
          set -euo pipefail
          # Avoid the HTTP Azure mirror timing out before Playwright can start.
          for apt_source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          npm exec playwright -- install --with-deps chromium firefox webkit
          npm run test:visual:prepare
          npm run start -- --port 3002 > /tmp/nexusrag-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3002/auth/login >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true || { cat /tmp/nexusrag-browser-server.log; exit 1; }
          npm exec playwright -- test public-smoke.spec.ts visual-regression.spec.ts --workers=2
          npm exec playwright -- test public-smoke.spec.ts --config=playwright.cross-browser.config.ts --workers=2
      - name: Actual Cloudflare Worker document routing regressions
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-public-browser-test-key
          NEXT_PUBLIC_API_URL: http://localhost:8000
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          npm run cf:build
          npm exec wrangler -- dev --local --port 3003 > /tmp/nexusrag-worker-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3003/auth/login >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true || { cat /tmp/nexusrag-worker-server.log; exit 1; }
          E2E_BASE_URL=http://localhost:3003 npm exec playwright -- test worker-routing.spec.ts --workers=2
          E2E_BASE_URL=http://localhost:3003 npm exec playwright -- test worker-routing.spec.ts --config=playwright.cross-browser.config.ts --workers=2
  dependency-review:
    name: Dependency review (lockfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Fail on high or critical npm advisories
        run: |
          set +e
          npm audit --json --audit-level=high > npm-audit.json
          audit_status=$?
          set -e
          node ../scripts/report_npm_audit.mjs npm-audit.json
          exit "$audit_status"
        working-directory: frontend
  supply-chain:
    name: SBOM and licence inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "24"}
      - run: node scripts/generate_supply_chain.mjs
      - name: Validate generated evidence
        run: |
          set -euo pipefail
          test -s artifacts/nexusrag.cdx.json
          test -s artifacts/license-inventory.json
          node -e 'const fs=require("fs"); const b=JSON.parse(fs.readFileSync("artifacts/nexusrag.cdx.json")); if(b.bomFormat!=="CycloneDX"||b.specVersion!=="1.6"||!b.components.length) process.exit(1)'
      - uses: actions/upload-artifact@v4
        with:
          name: v6-supply-chain-evidence
          path: |
            artifacts/nexusrag.cdx.json
            artifacts/license-inventory.json
          if-no-files-found: error
          retention-days: 14
  required-summary:
    name: Required foundation summary
    if: always()
    needs: [migration-integrity,backend-isolated,backend-full,evaluation-inventory,cloudflare-foundation,frontend,dependency-review,supply-chain,self-managed-runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless required jobs passed
        env:
          MIGRATION_RESULT: ${{ needs.migration-integrity.result }}
          BACKEND_RESULT: ${{ needs.backend-isolated.result }}
          BACKEND_FULL_RESULT: ${{ needs.backend-full.result }}
          EVALUATION_RESULT: ${{ needs.evaluation-inventory.result }}
          CLOUDFLARE_RESULT: ${{ needs.cloudflare-foundation.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          CONTAINER_RESULT: ${{ needs.self-managed-runtime.result }}
        run: |
          set -euo pipefail
          printf 'migration=%s backend=%s evaluation=%s cloudflare=%s frontend=%s dependency=%s supply_chain=%s\n' "$MIGRATION_RESULT" "$BACKEND_RESULT" "$EVALUATION_RESULT" "$CLOUDFLARE_RESULT" "$FRONTEND_RESULT" "$DEPENDENCY_RESULT" "$SUPPLY_CHAIN_RESULT"
          test "$MIGRATION_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$BACKEND_FULL_RESULT" = success
          test "$EVALUATION_RESULT" = success
          test "$CLOUDFLARE_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$DEPENDENCY_RESULT" = success
          test "$SUPPLY_CHAIN_RESULT" = success
          test "$CONTAINER_RESULT" = success
