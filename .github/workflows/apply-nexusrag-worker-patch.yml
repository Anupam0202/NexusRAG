name: Apply bounded Worker pipeline patch

on:
  push:
    branches: [v6-zero-cost-foundations-clean]
    paths:
      - .agent/nexusrag-worker.patch.gz.b64.part1
      - .agent/nexusrag-worker.patch.gz.b64.part2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and verify patch
        run: |
          cat .agent/nexusrag-worker.patch.gz.b64.part1 .agent/nexusrag-worker.patch.gz.b64.part2 | base64 --decode | gzip --decompress > /tmp/nexusrag-worker.patch
          echo "4f6d08837abfa8c6dcac968473a7e3cebd860a6015c3a647ec8a44f585217843  /tmp/nexusrag-worker.patch" | sha256sum --check
          git apply --check /tmp/nexusrag-worker.patch
      - name: Apply tested implementation
        run: |
          git apply --index /tmp/nexusrag-worker.patch
          rm -rf .agent
          rm -f .github/workflows/apply-nexusrag-worker-patch.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add bounded Worker ingestion and grounded chat"
          git push origin HEAD:v6-zero-cost-foundations-clean
