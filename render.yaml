services:
  - type: web
    name: nexusrag-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    numInstances: 1
    autoDeploy: true
    envVars:
      # Render injects PORT dynamically; 8000 is the local/default fallback.
      - key: PORT
        value: "8000"

      # Python runtime tuning
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "100000"
      - key: CONSTRAINED_MEMORY
        value: "true"

      # Logging
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO

      # Set this secret in the Render dashboard.
      - key: GOOGLE_API_KEY
        sync: false
      - key: BYOK_ENCRYPTION_KEY
        sync: false

      # Enterprise persistence/auth. Vercel's native Supabase integration does
      # not copy these values to Render, so mirror them in the Render dashboard.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      - key: ENABLE_ANONYMOUS_DEMO
        value: "false"
      - key: ENABLE_ASYNC_INGESTION
        value: "true"

      # Managed vector database wiring. The Qdrant URL/key stay secret in
      # Render, while the production vector mode is managed by this Blueprint.
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: nexusrag_chunks
      - key: ENABLE_QDRANT
        value: "true"
      - key: ENABLE_PGVECTOR_FALLBACK
        value: "false"
      - key: ENABLE_LOCAL_FAISS
        value: "false"

      - key: API_CORS_ORIGINS
        value: "https://nexusrag.vercel.app,https://nexusrag-anupam0202s-projects.vercel.app,http://localhost:3000,http://127.0.0.1:3000"

      # Memory guards for Render's 512 MB free tier. Enable the heavier
      # transformer features on a paid plan if you want maximum retrieval quality.
      - key: DISABLE_CROSS_ENCODER
        value: "true"

      # RAG pipeline settings (override in dashboard if needed)
      - key: LLM_MODEL_NAME
        value: "gemini-2.5-flash"
      - key: LLM_FALLBACK_MODELS
        value: "gemini-2.5-flash-lite,gemini-2.0-flash,gemini-2.0-flash-lite"
      # Configure these from current provider pricing to enable estimated-cost
      # reconciliation. Defaults stay at zero so the UI never implies exact billing.
      - key: LLM_INPUT_COST_USD_PER_MILLION
        value: "0"
      - key: LLM_OUTPUT_COST_USD_PER_MILLION
        value: "0"
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "200"
      - key: RETRIEVAL_TOP_K
        value: "10"
      - key: SIMILARITY_THRESHOLD
        value: "0.25"
      - key: ENABLE_RERANKING
        value: "false"
      - key: ENABLE_SEMANTIC_CHUNKING
        value: "false"
      - key: ENABLE_CONTEXTUAL_ENRICHMENT
        value: "false"
      - key: ENABLE_QUERY_EXPANSION
        value: "false"
      - key: ENABLE_LIGHTWEIGHT_EMBEDDINGS
        value: "true"
      - key: ENABLE_SCIENTIFIC_MODE
        value: "false"
      - key: ENABLE_PDF_EMBEDDED_IMAGE_OCR
        value: "false"
      - key: ENABLE_DOCX_EMBEDDED_IMAGE_OCR
        value: "false"
      - key: MAX_PDF_PAGES
        value: "40"
      - key: MAX_PDF_OCR_PAGES
        value: "12"
      - key: PDF_OCR_DPI
        value: "150"
      - key: MAX_PDF_EMBEDDED_IMAGES
        value: "4"
      - key: MAX_DOCX_EMBEDDED_IMAGES
        value: "4"
      - key: MAX_IMAGE_MEGAPIXELS
        value: "25"
      - key: MAX_UPLOAD_SIZE_MB
        value: "100"
