[project]
name = "nexus-rag"
version = "1.0.0"
description = "NexusRAG — Enterprise Document Intelligence Platform with FastAPI + Next.js"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # ── Core Framework ─────────────────────────────
    "fastapi>=0.136.3",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.31",
    "websockets>=12.0",

    # ── LangChain ──────────────────────────────────
    "langchain>=1.3.9",
    "langchain-core>=1.3.3",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.2.4",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-sdk>=0.3.15",
    "langsmith>=0.8.18",

    # ── Embeddings & Vector Store ──────────────────
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",

    # ── LLM Providers ─────────────────────────────
    "google-generativeai>=0.7.0",

    # ── Document Processing ────────────────────────
    "pypdf>=6.13.3",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",
    "pandas>=2.2.0",
    "Pillow>=12.2.0",

    # ── Re-ranking ─────────────────────────────────
    "torch>=2.11.0",

    # ── Utilities ──────────────────────────────────
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "numpy>=1.26.0",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=48.0.1",
    "aiohttp>=3.14.1",
    "idna>=3.15",
    "lxml>=6.1.0",
    "pyasn1>=0.6.3",
    "requests>=2.33.0",
    "ujson>=5.13.0",
    "msgpack>=1.2.1",
    "tornado>=6.5.7",
    "bleach>=6.4.0",
    "urllib3>=2.7.0",
    "pygments>=2.20.0",

    # ── Scientific Pipeline ────────────────────────────
    "opencv-python-headless>=4.9.0",
    "pymupdf>=1.24.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.4.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_any_generics = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
warn_unused_ignores = false
disable_error_code = ["attr-defined"]
